name: Bug report
description: Something on the site or in the API doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or endpoint
      placeholder: /menu/seoul-bbq-chicken-bowl/ or POST /api/orders
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 19, iPhone 17
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove any secrets or personal data first.
